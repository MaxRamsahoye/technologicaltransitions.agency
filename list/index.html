  <script>
    try {
      var navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      // arriving from another page of the site (or a refresh, or back/forward): fade in
      var fromSite = false;
      try { fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      // browsers with cross-document view transitions crossfade between pages
      // themselves; the others fade out and in (and so does a refresh)
      var vt = 'CSSViewTransitionRule' in window;
      if (vt) document.documentElement.classList.add('vt');
      if ((fromSite || (navEntry && navEntry.type !== 'navigate')) && (!vt || (navEntry && navEntry.type === 'reload'))) document.documentElement.classList.add('page-entering');
    } catch (e) {}
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (localStorage.getItem('blueLinks') !== 'off') document.documentElement.classList.add('colour');  // blue links (c): on by default
      if (localStorage.getItem('headings') !== 'sans') document.documentElement.classList.add('serif-headings');
      // the band colour (b): midnight blue by default, or sepia or black
      var band = localStorage.getItem('bandColour') || 'midnight';
      if (band === 'midnight' || band === 'black') document.documentElement.classList.add('band-' + band);
    } catch (e) {}
  </script>
