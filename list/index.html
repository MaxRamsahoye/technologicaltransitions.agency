<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="favicon-ico" rel="icon" href="../favicon/favicon-light.ico" sizes="any">
  <link id="favicon-32" rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32-light.png">
  <link id="favicon-192" rel="icon" type="image/png" sizes="192x192" href="../favicon/favicon-192-light.png">
  <link id="favicon-apple" rel="apple-touch-icon" href="../favicon/apple-touch-icon-light.png">
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('favicon-ico').href = '../favicon/favicon-dark.ico';
          document.getElementById('favicon-32').href = '../favicon/favicon-32-dark.png';
          document.getElementById('favicon-192').href = '../favicon/favicon-192-dark.png';
          document.getElementById('favicon-apple').href = '../favicon/apple-touch-icon-dark.png';
        }
      } catch (e) {}
    })();
  </script>
  <title>Contents — Max Ramsahoye</title>
  <style>
    @font-face {
      font-family: 'ET Bembo';
      src: url('../fonts/ETBembo-RomanOSF.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo';
      src: url('../fonts/ETBembo-SemiBoldOSF.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --canvas-bg: #f8f4ee;
      --canvas-ink: #000000;
      --canvas-accent: #000000;
      --selection-bg: rgba(186, 220, 240, 0.45);
      --rule: #e4ddd3;
      --serif: 'ET Bembo', Bembo, 'Times New Roman', Georgia, serif;
    }

    html[data-theme="dark"] {
      --canvas-bg: #000000;
      --canvas-ink: #ffffff;
      --canvas-accent: #ffffff;
      --selection-bg: rgba(180, 205, 235, 0.35);
      --rule: #232c4c;
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--canvas-ink);
    }

    ::-moz-selection {
      background: var(--selection-bg);
      color: var(--canvas-ink);
    }

    .click-ripple {
      position: fixed;
      left: 0;
      top: 0;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.55;
      transform: scale(0.3);
      animation: click-ripple-anim 0.4s ease-out forwards;
    }

    @keyframes click-ripple-anim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    html {
      background: var(--canvas-bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--canvas-bg);
      font-family: var(--serif);
      color: var(--canvas-ink);
      -webkit-font-smoothing: antialiased;
      opacity: 0;
      transition: background-color 0.25s ease, opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.page-visible {
      opacity: 1;
      transition: background-color 0.25s ease, opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .list-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .back-arrow {
      position: fixed;
      top: 50%;
      left: 240px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--canvas-ink);
      text-decoration: none;
    }

    .back-arrow:hover {
      color: var(--canvas-accent);
    }

    .back-arrow svg {
      width: 26px;
      height: 20px;
    }

    @media (max-width: 1000px) {
      .back-arrow {
        left: 40px;
      }
    }

    .list-heading {
      font-family: var(--serif);
      font-size: 60px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--canvas-ink);
      text-decoration: none;
      display: inline-block;
      margin: 0 0 24px;
    }

    .list-heading:hover {
      color: var(--canvas-accent);
      text-decoration: underline;
      text-decoration-color: var(--canvas-accent);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 6px;
    }

    .article-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .article-list a {
      display: block;
      padding: 16px 0;
      font-family: var(--serif);
      font-size: 26px;
      color: var(--canvas-ink);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .article-list a:hover {
      color: var(--canvas-accent);
      text-decoration: underline;
      text-decoration-color: var(--canvas-accent);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    @media (max-width: 480px) {
      .list-heading {
        font-size: 40px;
      }

      .article-list a {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <a class="back-arrow" href="../the-two-subcultures/" aria-label="Back">
    <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M10,1.5 L5,6 L18,6 A4,4 0 0 1 18,14 L1,14"/>
      <path d="M10,10.5 L5,6"/>
    </svg>
  </a>

  <div class="list-wrap">
    <a class="list-heading" href="../the-two-subcultures/">Max Ramsahoye</a>
    <ul class="article-list">
      <li><a href="../the-two-subcultures/">A Critical Evolutionary Game-Theory Model of Major Technological Transitions</a></li>
    </ul>
  </div>

  <script>
    (function () {
      requestAnimationFrame(function () {
        document.body.classList.add('page-visible');
      });

      window.addEventListener('pageshow', function (e) {
        if (e.persisted) {
          document.body.classList.add('page-visible');
        }
      });

      document.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var link = e.target.closest('a');
        if (!link || (link.target && link.target !== '_self')) return;
        var url;
        try { url = new URL(link.href, location.href); } catch (err) { return; }
        if (url.origin !== location.origin) return;
        if (url.pathname === location.pathname && url.hash) return;
        e.preventDefault();
        document.body.classList.remove('page-visible');
        setTimeout(function () {
          location.href = link.href;
        }, 800);
      });

      var backArrow = document.querySelector('.back-arrow');

      function goBack() {
        playPianoClick();
        var rect = backArrow.getBoundingClientRect();
        spawnRipple(rect.left + rect.width / 2, rect.top + rect.height / 2, getComputedStyle(backArrow).color);
        document.body.classList.remove('page-visible');
        setTimeout(function () {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            location.href = backArrow.getAttribute('href');
          }
        }, 800);
      }

      backArrow.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        goBack();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Backspace') return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
        e.preventDefault();
        goBack();
      });

      var root = document.documentElement;
      var THEMES = ['light', 'dark'];

      function setFavicons(isDark) {
        var suffix = isDark ? 'dark' : 'light';
        document.getElementById('favicon-ico').href = '../favicon/favicon-' + suffix + '.ico';
        document.getElementById('favicon-32').href = '../favicon/favicon-32-' + suffix + '.png';
        document.getElementById('favicon-192').href = '../favicon/favicon-192-' + suffix + '.png';
        document.getElementById('favicon-apple').href = '../favicon/apple-touch-icon-' + suffix + '.png';
      }

      function currentTheme() {
        var stored;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        return THEMES.indexOf(stored) !== -1 ? stored : 'light';
      }

      function applyTheme(theme) {
        if (theme === 'light') {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', theme);
        }
        setFavicons(theme === 'dark');
        try { localStorage.setItem('theme', theme); } catch (e) {}
      }

      function toggleTheme() {
        var next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
        applyTheme(next);
        playThemeSound(next === 'dark');
      }

      document.addEventListener('keydown', function (e) {
        if (e.key !== 't' && e.key !== 'T') return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
        toggleTheme();
      });

      var audioCtx = null;
      var pianoNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

      function playPianoClick() {
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          if (audioCtx.state === 'suspended') { audioCtx.resume(); }
          var freq = pianoNotes[Math.floor(Math.random() * pianoNotes.length)];
          var now = audioCtx.currentTime;

          var osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;

          var osc2 = audioCtx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.value = freq * 2;

          var gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.1, now + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

          var gain2 = audioCtx.createGain();
          gain2.gain.setValueAtTime(0, now);
          gain2.gain.linearRampToValueAtTime(0.025, now + 0.006);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

          osc.connect(gain).connect(audioCtx.destination);
          osc2.connect(gain2).connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.45);
          osc2.start(now);
          osc2.stop(now + 0.38);
        } catch (e) {}
      }

      document.addEventListener('click', function (e) {
        if (e.target.closest('.theme-toggle')) return;
        playPianoClick();
      });

      function playThemeSound(toDark) {
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          if (audioCtx.state === 'suspended') { audioCtx.resume(); }
          var notes = toDark ? [392.00, 329.63, 261.63] : [261.63, 329.63, 392.00];
          var start = audioCtx.currentTime;

          notes.forEach(function (freq, i) {
            var now = start + i * 0.17;
            [[freq, 0.05, 2.2], [freq * 2, 0.008, 1.2]].forEach(function (partial) {
              var osc = audioCtx.createOscillator();
              osc.type = 'sine';
              osc.frequency.value = partial[0];
              var gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0, now);
              gain.gain.linearRampToValueAtTime(partial[1], now + 0.03);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + partial[2]);
              osc.connect(gain).connect(audioCtx.destination);
              osc.start(now);
              osc.stop(now + partial[2]);
            });
          });
        } catch (e) {}
      }

      function spawnRipple(x, y, color) {
        var ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.borderColor = color;
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', function () {
          ripple.remove();
        });
      }

      document.addEventListener('click', function (e) {
        var iconBtn = e.target.closest('.theme-toggle, .hamburger-btn, .back-arrow, .scroll-top-btn, .scroll-down-btn');
        var x, y;
        if (iconBtn) {
          var rect = iconBtn.getBoundingClientRect();
          x = rect.left + rect.width / 2;
          y = rect.top + rect.height / 2;
        } else {
          x = e.clientX;
          y = e.clientY;
        }
        spawnRipple(x, y, getComputedStyle(e.target).color);
      });
    })();
  </script>
</body>
</html>
